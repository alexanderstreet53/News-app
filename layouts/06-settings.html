<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TLDR News — Settings</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #F7F7FB; color: #0A0E27; }
  .container { max-width: 480px; margin: 0 auto; padding: 0 16px; }

  .app-bar {
    padding: 16px; font-family: 'Space Grotesk';
    font-size: 22px; font-weight: 700;
  }

  .section-label {
    font-family: 'JetBrains Mono'; font-size: 11px; font-weight: 600;
    letter-spacing: 2px; color: #6C5CE7; margin: 8px 0;
  }

  .quick-actions { display: flex; gap: 10px; margin-bottom: 28px; }
  .qa-card {
    flex: 1; padding: 18px; border-radius: 22px;
    background: white; border: 1px solid rgba(0,0,0,0.03);
    cursor: pointer;
  }
  .qa-icon {
    width: 40px; height: 40px; border-radius: 14px;
    display: grid; place-items: center; font-size: 18px;
    margin-bottom: 12px;
  }
  .qa-label { font-size: 15px; font-weight: 600; }

  .settings-card {
    border-radius: 22px; background: white;
    border: 1px solid rgba(0,0,0,0.03); margin-bottom: 28px;
    overflow: hidden;
  }
  .settings-row {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 18px; cursor: pointer;
  }
  .settings-row:hover { background: rgba(0,0,0,0.02); }
  .sr-icon { font-size: 18px; color: #6B7280; }
  .sr-label { flex: 1; font-size: 15px; font-weight: 500; }
  .sr-trail { font-size: 11px; color: #6B7280; }
  .sr-arrow { color: #D1D5DB; font-size: 14px; }
  .settings-div {
    height: 1px; margin: 0 18px;
    background: rgba(0,0,0,0.04);
  }

  /* Theme picker */
  .theme-picker { display: flex; gap: 10px; margin: 16px 0 8px; }
  .theme-opt {
    flex: 1; padding: 16px; border-radius: 18px;
    background: rgba(0,0,0,0.03); text-align: center;
    cursor: pointer; border: 2px solid transparent; transition: all 0.2s;
  }
  .theme-opt.active {
    background: rgba(108,92,231,0.12);
    border-color: rgba(108,92,231,0.3);
  }
  .theme-opt .icon { font-size: 24px; margin-bottom: 8px; }
  .theme-opt .label { font-size: 13px; font-weight: 500; color: #6B7280; }
  .theme-opt.active .label { color: #6C5CE7; font-weight: 700; }

  .footer {
    text-align: center; padding: 40px 0 120px;
  }
  .footer-logo {
    display: inline-flex; align-items: center; gap: 8px; margin-bottom: 4px;
  }
  .footer-badge {
    background: linear-gradient(135deg, #6C5CE7, #A78BFA);
    color: white; font-family: 'Space Grotesk'; font-weight: 900;
    font-size: 12px; letter-spacing: 1px; padding: 4px 8px; border-radius: 8px;
  }
  .footer-text { font-family: 'Space Grotesk'; font-size: 16px; font-weight: 700; }
  .footer-sub { font-size: 12px; color: #6B7280; }

  .nav {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    width: calc(100% - 40px); max-width: 440px;
    backdrop-filter: blur(24px); background: rgba(255,255,255,0.85);
    border-radius: 28px; padding: 10px 8px;
    display: flex; justify-content: space-evenly;
    box-shadow: 0 8px 32px rgba(0,0,0,0.08); border: 1px solid rgba(0,0,0,0.04);
  }
  .nav-item { padding: 8px 12px; border-radius: 20px; font-size: 18px; cursor: pointer; display: flex; align-items: center; gap: 6px; color: #D1D5DB; }
  .nav-item.active { padding: 8px 16px; }
  .nav-item span { font-size: 12px; font-weight: 700; display: none; }
  .nav-item.active span { display: inline; }
</style>
</head>
<body>
  <div class="container">
    <div class="app-bar">More</div>

    <div class="section-label">QUICK ACTIONS</div>
    <div class="quick-actions">
      <div class="qa-card">
        <div class="qa-icon" style="background:rgba(108,92,231,0.12)">🔖</div>
        <div class="qa-label">Bookmarks</div>
      </div>
      <div class="qa-card">
        <div class="qa-icon" style="background:rgba(255,107,107,0.12)">🌙</div>
        <div class="qa-label">System</div>
      </div>
    </div>

    <div class="section-label">APPEARANCE</div>
    <div class="theme-picker">
      <div class="theme-opt active">
        <div class="icon">📱</div>
        <div class="label">System</div>
      </div>
      <div class="theme-opt">
        <div class="icon">☀️</div>
        <div class="label">Light</div>
      </div>
      <div class="theme-opt">
        <div class="icon">🌙</div>
        <div class="label">Dark</div>
      </div>
    </div>

    <br>
    <div class="section-label">TLDR</div>
    <div class="settings-card">
      <div class="settings-row">
        <span class="sr-icon">✉️</span>
        <span class="sr-label">Subscribe to Newsletter</span>
        <span class="sr-arrow">›</span>
      </div>
      <div class="settings-div"></div>
      <div class="settings-row">
        <span class="sr-icon">🌐</span>
        <span class="sr-label">Visit TLDR Website</span>
        <span class="sr-arrow">›</span>
      </div>
    </div>

    <div class="section-label">ABOUT</div>
    <div class="settings-card">
      <div class="settings-row">
        <span class="sr-icon">ℹ️</span>
        <span class="sr-label">App Version</span>
        <span class="sr-trail">1.0.0</span>
      </div>
      <div class="settings-div"></div>
      <div class="settings-row">
        <span class="sr-icon">🔒</span>
        <span class="sr-label">Privacy Policy</span>
        <span class="sr-arrow">›</span>
      </div>
      <div class="settings-div"></div>
      <div class="settings-row">
        <span class="sr-icon">📄</span>
        <span class="sr-label">Terms of Service</span>
        <span class="sr-arrow">›</span>
      </div>
    </div>

    <div class="footer">
      <div class="footer-logo">
        <span class="footer-badge">TLDR</span>
        <span class="footer-text">News</span>
      </div>
      <div class="footer-sub">Tech news, simplified.</div>
    </div>
  </div>

  <div class="nav">
    <div class="nav-item" style="color:#D1D5DB">⚡</div>
    <div class="nav-item" style="color:#D1D5DB">▶️</div>
    <div class="nav-item" style="color:#D1D5DB">✨</div>
    <div class="nav-item active" style="background:rgba(0,210,211,0.12);color:#00D2D3">⚙️ <span>More</span></div>
  </div>
</body>
</html>
