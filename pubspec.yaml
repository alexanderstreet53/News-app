name: tldr_news
description: A beautifully crafted news reader for the TLDR newsletter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  http: ^1.2.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  google_fonts: ^6.1.0
  html: ^0.15.4
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  timeago: ^3.6.1
  go_router: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
